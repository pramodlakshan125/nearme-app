name: near_me
description: "A Proximity-Based Social Discovery Flutter App."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.1'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  permission_handler: ^11.3.1
  image_picker: ^1.2.4
  nearby_connections: ^4.3.0
  shared_preferences: ^2.5.6
  path_provider: ^2.1.5
  image: ^4.5.4
  device_info_plus: 13.3.0
  url_launcher: ^6.3.3
  flutter_local_notifications: ^22.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/NearMe.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/NearMe.png"
  remove_alpha_ios: true