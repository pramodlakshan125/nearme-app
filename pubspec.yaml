name: near_me
description: "A Proximity-Based Social Discovery Flutter App."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.1
  google_sign_in: ^6.2.1
  flutter_reactive_ble: ^5.3.1
  permission_handler: ^11.3.1
  url_launcher: ^6.3.0
  firebase_app_check: ^0.3.2+10
  image_picker: ^1.2.4
  firebase_storage: ^12.4.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/NearMe.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/NearMe.png"
  remove_alpha_ios: true